name: deploy
on:
  push: { branches: [main] }
  workflow_dispatch:

# OIDC federation. No AZURE_CLIENT_SECRET is stored here.
permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Build and push images
        run: |
          az acr login --name "${{ vars.ACR_NAME }}"
          for c in pipeline api interface; do
            img="${{ vars.ACR_NAME }}.azurecr.io/$c"
            docker build -f "$c/Dockerfile" -t "$img:${{ github.sha }}" -t "$img:latest" .
            docker push "$img:${{ github.sha }}"
            docker push "$img:latest"
          done
      - name: Deploy infrastructure
        run: |
          az deployment group create \
            -g "${{ vars.RESOURCE_GROUP }}" \
            -f infra/azure/main.bicep \
            -p env=dev pgAdminPassword="${{ secrets.PG_ADMIN_PASSWORD }}"
